<!DOCTYPE html>
<!--
VTuber Telop System
Version: 1.0.6
Author: Umetana
-->
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuberテロップシステム v1.0.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&family=Kaisei+Tokumin:wght@700&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@700&display=swap"
        rel="stylesheet">
    <style>
        body.mode-display {
            background-color: transparent !important;
            overflow: hidden;
        }

        .telop-container {
            position: fixed;
            left: 0;
            width: auto;
            max-width: 100vw;
            white-space: nowrap;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

        .preview-box .telop-container {
            position: absolute;
        }

        .telop-container.hidden-telop {
            opacity: 0;
            pointer-events: none;
        }

        .telop-text {
            text-align: center;
            word-break: break-word;
            transition: opacity 0.3s ease;
            line-height: 1.2;
        }

        .btn-transition {
            transition: all 0.2s;
        }

        .btn-transition:active {
            transform: scale(0.95);
        }

        .preview-box {
            position: relative;
            width: 100%;
            height: 150px;
            background: #ccc;
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee),
                linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        /* 初期化ボタンの無効化スタイル */
        #cfg-reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* === Frame layer (image mode) === */
        /* JSで left/top/transform を制御する前提 */

        .telop-frame {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            height: auto;
            z-index: 0;
            pointer-events: none;
            user-select: none;
            max-width: none !important;
            max-height: none !important;
        }

        .telop-text {
            position: relative;
            /* フレームの上に載せる */
            z-index: 2;
            padding: 0.4em 1em;
            border-radius: 8px;
            border-style: solid;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex flex-col">

    <nav id="global-nav" class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center z-50">
        <h1 class="font-bold text-xl cursor-pointer" onclick="switchView('portal')">テロップシステム v1.0.6</h1>
        <div class="space-x-4 text-sm md:text-base">
            <button onclick="switchView('generator')" class="hover:text-indigo-200">ジェネレーター</button>
            <button onclick="switchView('settings')" class="hover:text-indigo-200">設定</button>
            <button onclick="switchView('controller')"
                class="bg-white text-indigo-600 px-3 py-1 rounded-md font-bold hover:bg-indigo-50">操作パネル</button>
        </div>
    </nav>

    <main class="flex-1 overflow-y-auto relative">

        <!-- ポータル -->
        <div id="view-portal" class="view-section h-full flex flex-col items-center justify-center p-8 hidden">
            <h2 class="text-3xl font-bold mb-8 text-gray-700">システムメニュー</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl w-full">
                <div onclick="switchView('generator')"
                    class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md cursor-pointer border-t-4 border-blue-500 btn-transition">
                    <h3 class="text-xl font-bold mb-2 flex items-center">📝 ジェネレーター</h3>
                    <p class="text-gray-600 text-sm">トークリストの作成・バックアップ管理。</p>
                </div>
                <div onclick="switchView('settings')"
                    class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md cursor-pointer border-t-4 border-gray-500 btn-transition">
                    <h3 class="text-xl font-bold mb-2 flex items-center">⚙️ 表示設定</h3>
                    <p class="text-gray-600 text-sm">色・透明度・位置・フォントの微調整。</p>
                </div>
                <div onclick="switchView('controller')"
                    class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md cursor-pointer border-t-4 border-indigo-500 btn-transition col-span-1 md:col-span-2">
                    <h3 class="text-xl font-bold mb-2 flex items-center">🎮 操作パネル</h3>
                    <p class="text-gray-600 text-sm">配信中のメイン操作。話題の切り替え。</p>
                </div>
            </div>
        </div>

        <!-- ジェネレーター -->
        <div id="view-generator" class="view-section p-8 max-w-4xl mx-auto hidden">
            <h2 class="text-2xl font-bold mb-6 border-b pb-2 text-blue-700">📝 データジェネレーター</h2>
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center gap-2 mb-4 border-b pb-4">
                    <span class="text-xs font-bold text-gray-400 uppercase mr-2">Editing:</span>
                    <button onclick="switchEditingSlot(0)" id="gen-slot-0"
                        class="px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-indigo-500 bg-indigo-500 text-white">Preset
                        1</button>
                    <button onclick="switchEditingSlot(1)" id="gen-slot-1"
                        class="px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-gray-200 text-gray-400 hover:border-gray-300">Preset
                        2</button>
                    <button onclick="switchEditingSlot(2)" id="gen-slot-2"
                        class="px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-gray-200 text-gray-400 hover:border-gray-300">Preset
                        3</button>
                </div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-gray-700 font-bold">本日のトークテーマ（1行1項目）</label>
                    <button onclick="clearGeneratorInput()"
                        class="text-xs bg-red-50 text-red-500 hover:bg-red-100 px-2 py-1 rounded border border-red-200 font-bold btn-transition">
                        すべて消去
                    </button>
                </div>
                <textarea id="gen-input"
                    class="w-full h-48 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none mb-4"
                    placeholder="開始の挨拶&#13;&#10;雑談ネタ"></textarea>

                <div class="flex gap-4">
                    <button onclick="saveDataToStorage()"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 btn-transition flex-1">
                        システムに登録
                    </button>
                    <button onclick="exportData()"
                        class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-300 btn-transition">
                        バックアップDL
                    </button>
                </div>
                <div class="mt-4 pt-4 border-t text-center">
                    <label
                        class="inline-block bg-white border border-gray-300 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-50 btn-transition cursor-pointer w-full">
                        📥 バックアップ(.json)を読み込む
                        <input type="file" id="gen-file-input" accept=".json" class="hidden"
                            onchange="importData(event)">
                    </label>
                </div>
                <p id="gen-msg" class="text-green-600 font-bold mt-4 hidden text-center"></p>
            </div>
        </div>

        <!-- 設定 -->
        <div id="view-settings" class="view-section p-8 max-w-4xl mx-auto hidden">
            <div class="flex justify-between items-center mb-6 border-b pb-2">
                <h2 class="text-2xl font-bold">⚙️ 表示設定</h2>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-400 uppercase mr-2">Editing:</span>
                    <button onclick="switchEditingSlot(0)" id="set-slot-0"
                        class="px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-indigo-500 bg-indigo-500 text-white">Preset
                        1</button>
                    <button onclick="switchEditingSlot(1)" id="set-slot-1"
                        class="px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-gray-200 text-gray-400 hover:border-gray-300">Preset
                        2</button>
                    <button onclick="switchEditingSlot(2)" id="set-slot-2"
                        class="px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-gray-200 text-gray-400 hover:border-gray-300">Preset
                        3</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-sm space-y-6 overflow-y-auto max-h-[70vh]">

                    <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-lg space-y-3">
                        <label class="block text-indigo-700 font-bold text-sm uppercase">Font Style (フォント)</label>
                        <div>
                            <select id="cfg-font" class="w-full p-2 border rounded-md bg-white">
                                <option value="'Noto Sans JP', sans-serif">Noto Sans JP (標準)</option>
                                <option value="'Mochiy Pop One', sans-serif">Mochiy Pop One (ポップ)</option>
                                <option value="'Dela Gothic One', sans-serif">Dela Gothic One (極太)</option>
                                <option value="'Kaisei Tokumin', serif">Kaisei Tokumin (明朝体)</option>
                                <option value="'DotGothic16', sans-serif">DotGothic16 (ドット風)</option>
                            </select>
                        </div>
                    </div>

                    <div class="p-4 bg-gray-50 rounded-lg space-y-3">
                        <label class="block text-indigo-700 font-bold text-sm uppercase">Text (文字)</label>
                        <div class="grid grid-cols-2 gap-4 items-end">
                            <div>
                                <label class="text-xs text-gray-500">色</label>
                                <div class="flex gap-1">
                                    <input type="color" id="cfg-color"
                                        class="w-12 h-10 cursor-pointer rounded border p-0 flex-shrink-0">
                                    <input type="text" id="cfg-color-hex"
                                        class="flex-1 px-2 text-xs border rounded uppercase font-mono h-10"
                                        placeholder="#FFFFFF">
                                </div>
                            </div>
                        </div>
                        <div>
                            <div>
                                <label class="text-xs text-gray-500 flex justify-between">
                                    不透明度 <span id="val-color-alpha">100%</span>
                                </label>
                                <input type="range" id="cfg-color-alpha" min="0" max="100" value="100"
                                    class="w-full h-10">
                            </div>
                        </div>

                        <!-- Outline Settings -->
                        <div class="pt-2 border-t mt-2 space-y-3">
                            <label class="block text-xs font-bold text-gray-400 uppercase">Outline (縁取り)</label>
                            <div class="grid grid-cols-2 gap-4 items-end">
                                <div>
                                    <label class="text-xs text-gray-500">色</label>
                                    <div class="flex gap-1">
                                        <input type="color" id="cfg-outline-color"
                                            class="w-12 h-10 cursor-pointer rounded border p-0 flex-shrink-0"
                                            value="#000000">
                                        <input type="text" id="cfg-outline-color-hex"
                                            class="flex-1 px-2 text-xs border rounded uppercase font-mono h-10"
                                            placeholder="#000000">
                                    </div>
                                </div>
                            </div>
                            <div>
                                <div>
                                    <label class="text-xs text-gray-500 flex justify-between">
                                        不透明度 <span id="val-outline-alpha">100%</span>
                                    </label>
                                    <input type="range" id="cfg-outline-alpha" min="0" max="100" value="100"
                                        class="w-full h-10">
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 flex justify-between">
                                    太さ <span id="val-outline-width">0px</span>
                                </label>
                                <input type="range" id="cfg-outline-width" min="0" max="20" value="0" class="w-full">
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-gray-50 rounded-lg space-y-3">
                        <label class="block text-indigo-700 font-bold text-sm uppercase">Background (背景)</label>
                        <div class="grid grid-cols-2 gap-4 items-end">
                            <div>
                                <label class="text-xs text-gray-500">色</label>
                                <div class="flex gap-1">
                                    <input type="color" id="cfg-bg-base"
                                        class="w-12 h-10 cursor-pointer rounded border p-0 flex-shrink-0">
                                    <input type="text" id="cfg-bg-base-hex"
                                        class="flex-1 px-2 text-xs border rounded uppercase font-mono h-10"
                                        placeholder="#000000">
                                </div>
                            </div>
                        </div>
                        <div>
                            <div>
                                <label class="text-xs text-gray-500 flex justify-between">
                                    不透明度 <span id="val-bg-alpha">75%</span>
                                </label>
                                <input type="range" id="cfg-bg-alpha" min="0" max="100" value="75" class="w-full h-10">
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-gray-50 rounded-lg space-y-3">
                        <label class="block text-indigo-700 font-bold text-sm uppercase">Accent Line (線)</label>
                        <div class="grid grid-cols-2 gap-4 items-end">
                            <div>
                                <label class="text-xs text-gray-500">色</label>
                                <div class="flex gap-1">
                                    <input type="color" id="cfg-border"
                                        class="w-12 h-10 cursor-pointer rounded border p-0 flex-shrink-0">
                                    <input type="text" id="cfg-border-hex"
                                        class="flex-1 px-2 text-xs border rounded uppercase font-mono h-10"
                                        placeholder="#4F46E5">
                                </div>
                            </div>
                        </div>
                        <div>
                            <div>
                                <label class="text-xs text-gray-500 flex justify-between">
                                    不透明度 <span id="val-border-alpha">100%</span>
                                </label>
                                <input type="range" id="cfg-border-alpha" min="0" max="100" value="100"
                                    class="w-full h-10">
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-gray-50 rounded-lg space-y-4">
                        <label class="block text-indigo-700 font-bold text-sm uppercase">Layout (配置)</label>
                        <div class="pt-2">
                            <label class="text-xs text-gray-500">フレーム（画像プリセット）</label>
                            <select id="cfg-framePreset" class="w-full p-2 border rounded-md bg-white">
                                <option value="news">News</option>
                                <option value="news2">News2</option>
                                <option value="pop">Pop</option>
                                <option value="pop2">Pop2</option>
                                <option value="pop3">Pop3</option>
                                <option value="none">None（透明）</option>
                            </select>
                        </div>


                        <div>
                            <label class="text-xs text-gray-500">フォントサイズ (px)</label>
                            <input type="number" id="cfg-size" class="w-full p-2 border rounded-md" value="36">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 flex justify-between">
                                垂直位置 (Y軸) <span id="val-pos-y">90%</span>
                            </label>
                            <input type="range" id="cfg-pos-y" min="0" max="100" value="90" class="w-full">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 flex justify-between">
                                水平位置 (X軸) <span id="val-pos-x">50%</span>
                            </label>
                            <input type="range" id="cfg-pos-x" min="0" max="100" value="50" class="w-full">
                        </div>
                        <div class="pt-2 border-t mt-2">
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Text Offset
                                (文字の微調整)</label>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs text-gray-500 flex justify-between">
                                        左右 <span id="val-text-offset-x">0px</span>
                                    </label>
                                    <input type="range" id="cfg-text-offset-x" min="-200" max="200" value="0"
                                        class="w-full">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-500 flex justify-between">
                                        上下 <span id="val-text-offset-y">0px</span>
                                    </label>
                                    <input type="range" id="cfg-text-offset-y" min="-200" max="200" value="0"
                                        class="w-full">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-gray-500 flex justify-between">
                                フレーム倍率 <span id="val-frame-scale">1.00</span>
                            </label>
                            <input type="range" id="cfg-frame-scale" min="0.6" max="1.4" step="0.01" value="1.0"
                                class="w-full">
                        </div>
                        <div class="pt-2 border-t mt-2">
                            <label class="flex items-center gap-2 cursor-pointer select-none">
                                <input type="checkbox" id="cfg-fullWidth" class="w-4 h-4">
                                <span class="text-sm font-bold text-indigo-700">帯状にする（横幅いっぱい）</span>
                            </label>
                        </div>
                    </div>

                    <div class="p-4 bg-green-50 border border-green-100 rounded-lg space-y-3">
                        <label class="block text-green-700 font-bold text-sm uppercase">Remote Link (外部連携)</label>
                        <div>
                            <label class="text-xs text-gray-500 italic mb-1 block">GP MULTI COUNTER の対象IDを指定（例:
                                counter1）</label>
                            <input type="text" id="cfg-remote-id" class="w-full p-2 border rounded-md bg-white"
                                placeholder="counter1" value="">
                        </div>
                    </div>

                    <div class="space-y-4">
                        <button id="cfg-save-btn" onclick="saveConfig()"
                            class="bg-indigo-600 text-white px-8 py-4 rounded-lg font-bold hover:bg-indigo-700 w-full btn-transition shadow-lg">
                            設定を保存
                        </button>

                        <div class="pt-6 border-t mt-6">
                            <div class="bg-red-50 p-4 rounded-lg border border-red-100">
                                <label class="flex items-center gap-2 cursor-pointer mb-3 select-none">
                                    <input type="checkbox" id="cfg-reset-lock" class="w-4 h-4"
                                        onchange="toggleResetBtn()">
                                    <span class="text-xs text-red-700 font-bold">設定を初期化（デフォルトに戻す）を許可する</span>
                                </label>
                                <button id="cfg-reset-btn" onclick="resetConfig()" disabled
                                    class="bg-white border border-red-300 text-red-600 px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-600 hover:text-white w-full btn-transition">
                                    すべての表示設定を初期化
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="block text-gray-700 font-bold mb-2">リアルタイムプレビュー</label>
                    <div
                        class="preview-box border-2 border-dashed border-gray-300 flex-1 relative min-h-[350px] bg-gray-200">
                        <div id="preview-telop" class="telop-container">
                            <img id="preview-frame" class="telop-frame" alt="">
                            <span id="preview-text" class="telop-text">プレビューテキスト</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作パネル -->
        <div id="view-controller" class="view-section p-4 h-full flex flex-col max-w-4xl mx-auto hidden">
            <div
                class="bg-white p-4 rounded-xl shadow-sm mb-4 flex justify-between items-center border-t-4 border-indigo-500">
                <div class="flex-1 mr-4">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-gray-400 font-bold text-xs uppercase">On-Air Slot</span>
                        <div class="flex gap-1">
                            <button onclick="activateSlot(0)" id="ctrl-slot-0"
                                class="px-2 py-0.5 rounded text-[10px] font-bold border transition-all bg-indigo-600 text-white border-indigo-600">SLOT
                                1</button>
                            <button onclick="activateSlot(1)" id="ctrl-slot-1"
                                class="px-2 py-0.5 rounded text-[10px] font-bold border transition-all bg-white text-gray-400 border-gray-200">SLOT
                                2</button>
                            <button onclick="activateSlot(2)" id="ctrl-slot-2"
                                class="px-2 py-0.5 rounded text-[10px] font-bold border transition-all bg-white text-gray-400 border-gray-200">SLOT
                                3</button>
                        </div>
                    </div>
                    <div class="text-xl font-bold text-indigo-700 truncate" id="ctrl-current-text">待機中...</div>
                </div>
                <div class="flex items-center gap-2 border-l pl-4">
                    <button id="ctrl-toggle-btn" onclick="toggleVisibility()"
                        class="bg-green-500 text-white px-6 py-2 rounded-md font-bold btn-transition shadow-sm">ON</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-indigo-100">
                <button type="button" onclick="toggleAutoRotatePanel()"
                    class="w-full flex items-center justify-between gap-4 text-left">
                    <div class="flex-1">
                        <div class="text-xs font-bold text-gray-400 uppercase mb-1">Auto Rotation</div>
                        <div id="ctrl-auto-summary" class="text-sm text-gray-600">お知らせや箇条書きを一定時間ごとに自動で切り替えます。</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div id="ctrl-auto-status" class="text-xs font-bold text-gray-400">自動送りは停止中です</div>
                        <span id="ctrl-auto-panel-icon" class="text-gray-400 text-sm">▼</span>
                    </div>
                </button>
                <div id="ctrl-auto-panel" class="hidden mt-4 pt-4 border-t border-indigo-100">
                    <div class="flex flex-col md:flex-row md:items-end gap-4">
                        <div class="flex items-end gap-3 flex-wrap">
                            <label class="block">
                                <span class="text-xs text-gray-500">切替秒数</span>
                                <input id="ctrl-auto-seconds" type="number" min="1" max="600" value="8"
                                    class="w-24 p-2 border rounded-md bg-white">
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-600 pb-2">
                                <input id="ctrl-auto-loop" type="checkbox" class="w-4 h-4" checked>
                                <span>ループ</span>
                            </label>
                            <button id="ctrl-auto-btn" onclick="toggleAutoRotate()"
                                class="bg-orange-500 text-white px-5 py-2 rounded-md font-bold btn-transition shadow-sm">AUTO
                                OFF</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-white rounded-xl shadow-sm flex flex-col overflow-hidden border">
                <div class="flex-1 overflow-y-auto p-2" id="ctrl-list"></div>
                <div class="bg-gray-50 p-4 border-t flex justify-between items-center gap-4">
                    <button onclick="changeIndex(-1)"
                        class="bg-white border text-gray-700 flex-1 py-4 rounded-xl font-bold text-xl hover:bg-gray-100 btn-transition shadow-sm">◀
                        PREV</button>
                    <div class="text-center min-w-[80px]">
                        <span id="ctrl-progress" class="text-lg font-mono font-bold text-gray-500">0 / 0</span>
                    </div>
                    <button onclick="changeIndex(1)"
                        class="bg-indigo-600 text-white flex-1 py-4 rounded-xl font-bold text-xl hover:bg-indigo-700 btn-transition shadow-lg">NEXT
                        ▶</button>
                </div>
            </div>
        </div>

        <!-- 表示モード用 -->
        <div id="view-display" class="view-section hidden w-full h-full">
            <div id="obs-telop" class="telop-container">
                <img id="obs-frame" class="telop-frame" alt="">
                <div id="obs-text" class="telop-text"></div>
            </div>
        </div>

    </main>

    <script>
        const BC_NAME = 'vtuber_telop_channel';
        const bc = new BroadcastChannel(BC_NAME);
        const remoteBc = new BroadcastChannel('obs_counter_sync');
        let lastRemoteCount = null;
        let autoRotateTimer = null;

        const FRAME_PRESETS = {
            none: { src: null },
            news: { src: 'frames/news.png' },
            news2: { src: 'frames/news2.png' },
            pop: { src: 'frames/pop.png' },
            pop2: { src: 'frames/pop2.png' },
            pop3: { src: 'frames/pop3.png' },
        };

        const DEFAULT_CONFIG = {
            font: "'Noto Sans JP', sans-serif",
            color: '#ffffff',
            colorAlpha: 100,
            bgBase: '#000000',
            bgAlpha: 75,
            border: '#4f46e5',
            borderAlpha: 100,
            size: 36,
            posY: 90,

            // ▼追加
            posX: 50,              // 左右位置
            framePreset: 'news',   // none | news | pop
            frameScale: 1.0,       // フレーム拡大縮小
            textOffsetX: 0,        // 文字Xオフセット
            textOffsetY: 0,        // 文字Yオフセット
            remoteId: '',
            fullWidth: false,      // 追加：帯状にするかどうか
            outlineColor: '#000000',
            outlineWidth: 0,
            outlineAlpha: 100
        };

        let state = {
            presets: [
                { data: [], config: { ...DEFAULT_CONFIG } },
                { data: [], config: { ...DEFAULT_CONFIG } },
                { data: [], config: { ...DEFAULT_CONFIG } }
            ],
            activeIndex: 0,    // On-air preset index (0-2)
            editingIndex: 0,   // Current selecting preset for editing (0-2)
            index: 0,          // Current line index in the active preset
            visible: true,
            autoRotate: {
                enabled: false,
                intervalSec: 8,
                loop: true
            },
            autoRotatePanelOpen: false
        };

        // For backward compatibility and convenience
        Object.defineProperty(state, 'data', { get() { return this.presets[this.activeIndex].data; } });
        Object.defineProperty(state, 'config', { get() { return this.presets[this.activeIndex].config; } });

        function normalizePreset(preset = {}) {
            return {
                data: Array.isArray(preset.data) ? preset.data : [],
                config: { ...DEFAULT_CONFIG, ...(preset.config || {}) }
            };
        }

        function normalizePresets(presets) {
            const normalized = Array.isArray(presets) ? presets.slice(0, 3).map(normalizePreset) : [];
            while (normalized.length < 3) {
                normalized.push(normalizePreset());
            }
            return normalized;
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            loadFromStorage();
            if (mode === 'display') {
                document.body.classList.add('mode-display');
                document.getElementById('global-nav').style.display = 'none';
                switchView('display');
                applyConfigToElement(document.getElementById('obs-telop'), document.getElementById('obs-text'));
                updateDisplayUI();
            } else {
                switchView('portal');
                initGeneratorUI();
                initConfigUI();
            }
            bc.onmessage = handleMessage;
            remoteBc.onmessage = handleRemoteMessage;
            syncAutoRotateControls();
            restartAutoRotateIfNeeded();
        }

        function handleMessage(event) {
            const msg = event.data;
            if (msg.type === 'UPDATE_SLOT') {
                const { slotIndex, data, config } = msg.payload;
                state.presets[slotIndex] = normalizePreset({ data, config });
                if (slotIndex === state.activeIndex) {
                    if (isVisible('display')) {
                        applyConfigToElement(document.getElementById('obs-telop'), document.getElementById('obs-text'));
                        updateDisplayUI();
                    }
                }
                if (isVisible('controller')) {
                    renderControllerList();
                    updateControllerUI();
                }
                if (isVisible('generator') && slotIndex === state.editingIndex) initGeneratorUI();
                if (isVisible('settings') && slotIndex === state.editingIndex) {
                    initConfigUI();
                    reflectConfigToPreview();
                }
            }
            if (msg.type === 'SWITCH_ACTIVE_SLOT') {
                state.activeIndex = msg.payload;
                state.index = 0;
                if (isVisible('display')) {
                    applyConfigToElement(document.getElementById('obs-telop'), document.getElementById('obs-text'));
                    updateDisplayUI();
                }
                if (isVisible('controller')) {
                    updateControllerUI();
                }
            }
            if (msg.type === 'UPDATE_DATA') {
                // This legacy type now updates the active slot
                state.presets[state.activeIndex].data = msg.payload;
                state.index = 0;
                if (isVisible('controller')) renderControllerList();
                if (isVisible('display')) updateDisplayUI();
            }
            if (msg.type === 'UPDATE_INDEX') {
                state.index = msg.payload;
                if (isVisible('controller')) updateControllerUI();
                if (isVisible('display')) updateDisplayUI();
            }
            if (msg.type === 'TOGGLE_VISIBILITY') {
                state.visible = msg.payload;
                if (isVisible('controller')) updateControllerUI();
                if (isVisible('display')) updateDisplayUI();
            }
            if (msg.type === 'LIVE_CONFIG') {
                // Live config updates the active slot's config for immediate feedback
                state.presets[state.activeIndex].config = { ...DEFAULT_CONFIG, ...msg.payload };
                if (isVisible('display')) applyConfigToElement(document.getElementById('obs-telop'), document.getElementById('obs-text'));
                if (isVisible('settings')) reflectConfigToPreview();
            }
            if (msg.type === 'AUTO_ROTATE_SETTINGS') {
                state.autoRotate = {
                    ...state.autoRotate,
                    ...msg.payload,
                    intervalSec: Math.max(1, parseInt(msg.payload.intervalSec, 10) || state.autoRotate.intervalSec || 8),
                    enabled: !!msg.payload.enabled,
                    loop: !!msg.payload.loop
                };
                saveAutoRotateSettings();
                syncAutoRotateControls();
                restartAutoRotateIfNeeded();
            }
        }

        function handleRemoteMessage(event) {
            const msg = event.data;
            const targetId = state.config.remoteId;
            if (msg.type === 'update' && targetId) {
                const counterData = msg.payload.find(c => c.id === targetId);
                if (counterData) {
                    const currentCount = counterData.count;
                    if (lastRemoteCount !== null) {
                        if (currentCount > lastRemoteCount) changeIndex(1);
                        else if (currentCount < lastRemoteCount) changeIndex(-1);
                    }
                    lastRemoteCount = currentCount;
                }
            }
        }

        const isVisible = (id) => {
            const el = document.getElementById(`view-${id}`);
            return el && !el.classList.contains('hidden');
        };

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
            if (viewId === 'controller') { renderControllerList(); updateControllerUI(); }
            if (viewId === 'settings') { initConfigUI(); reflectConfigToPreview(); }
            if (viewId === 'generator') { initGeneratorUI(); }
        }

        function loadFromStorage() {
            const sPresets = localStorage.getItem('vt_telop_presets');
            const sActiveIdx = localStorage.getItem('vt_telop_active_slot');
            const sIdx = localStorage.getItem('vt_telop_index');
            const sVis = localStorage.getItem('vt_telop_visible');
            const sAutoRotate = localStorage.getItem('vt_telop_auto_rotate');

            if (sPresets) {
                state.presets = normalizePresets(JSON.parse(sPresets));
            } else {
                // Migration or initial load
                const sData = localStorage.getItem('vt_telop_data');
                const sCfg = localStorage.getItem('vt_telop_config');
                if (sData) state.presets[0].data = JSON.parse(sData);
                if (sCfg) state.presets[0].config = { ...DEFAULT_CONFIG, ...JSON.parse(sCfg) };
            }

            state.presets = normalizePresets(state.presets);

            if (sActiveIdx) state.activeIndex = parseInt(sActiveIdx, 10);
            if (sIdx) state.index = parseInt(sIdx, 10);
            if (sVis) state.visible = JSON.parse(sVis);
            if (sAutoRotate) {
                state.autoRotate = { ...state.autoRotate, ...JSON.parse(sAutoRotate) };
                state.autoRotate.intervalSec = Math.max(1, parseInt(state.autoRotate.intervalSec, 10) || 8);
                state.autoRotate.loop = !!state.autoRotate.loop;
                state.autoRotate.enabled = !!state.autoRotate.enabled;
            }

            state.editingIndex = state.activeIndex;
        }

        function saveToStorage(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
        function saveAutoRotateSettings() { saveToStorage('vt_telop_auto_rotate', state.autoRotate); }

        function syncAutoRotatePanel() {
            const panelEl = document.getElementById('ctrl-auto-panel');
            const iconEl = document.getElementById('ctrl-auto-panel-icon');
            if (panelEl) panelEl.classList.toggle('hidden', !state.autoRotatePanelOpen);
            if (iconEl) iconEl.innerText = state.autoRotatePanelOpen ? '▲' : '▼';
        }

        function toggleAutoRotatePanel(forceOpen = null) {
            state.autoRotatePanelOpen = typeof forceOpen === 'boolean' ? forceOpen : !state.autoRotatePanelOpen;
            syncAutoRotatePanel();
        }

        function showGenMsg(text, isError = false) {
            const msgEl = document.getElementById('gen-msg');
            msgEl.innerText = text;
            msgEl.className = `font-bold mt-4 text-center ${isError ? 'text-red-600' : 'text-green-600'}`;
            msgEl.classList.remove('hidden');
            setTimeout(() => msgEl.classList.add('hidden'), 3000);
        }

        function initGeneratorUI() { document.getElementById('gen-input').value = state.presets[state.editingIndex].data.join('\n'); }

        function switchEditingSlot(idx) {
            state.editingIndex = idx;
            // Update UI tabs
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`gen-slot-${i}`);
                if (btn) {
                    if (i === idx) {
                        btn.className = "px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-indigo-500 bg-indigo-500 text-white";
                    } else {
                        btn.className = "px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-gray-200 text-gray-400 hover:border-gray-300";
                    }
                }
            }
            initGeneratorUI();
            if (isVisible('settings')) {
                initConfigUI();
                reflectConfigToPreview();
            }
        }

        function clearGeneratorInput() {
            document.getElementById('gen-input').value = '';
            showGenMsg('テキストエリアを空にしました');
        }

        function saveDataToStorage() {
            const data = document.getElementById('gen-input').value.split('\n').map(l => l.trim()).filter(l => l !== "");
            state.presets[state.editingIndex].data = data;

            saveToStorage('vt_telop_presets', state.presets);

            // If the editing slot is the on-air slot, sync it
            if (state.editingIndex === state.activeIndex) {
                state.index = 0;
                saveToStorage('vt_telop_index', state.index);
                bc.postMessage({ type: 'UPDATE_DATA', payload: data });
            }
            // Notify other instances about the slot update
            bc.postMessage({
                type: 'UPDATE_SLOT',
                payload: {
                    slotIndex: state.editingIndex,
                    data: state.presets[state.editingIndex].data,
                    config: state.presets[state.editingIndex].config
                }
            });
            showGenMsg('✓ プリセット' + (state.editingIndex + 1) + 'に登録しました');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(state.data, null, 4)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'telop_backup.json';
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data)) {
                        document.getElementById('gen-input').value = data.join('\n');
                        showGenMsg('✓ バックアップを読み込みました。「登録」で確定してください');
                    } else {
                        showGenMsg('❌ 無効なファイル形式です', true);
                    }
                } catch (err) {
                    showGenMsg('❌ 読み込みに失敗しました', true);
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function initConfigUI() {
            const cfg = state.presets[state.editingIndex].config;
            // Update UI tabs in Settings
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`set-slot-${i}`);
                if (btn) {
                    if (i === state.editingIndex) {
                        btn.className = "px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-indigo-500 bg-indigo-500 text-white";
                    } else {
                        btn.className = "px-4 py-2 rounded-md font-bold text-sm transition-all border-2 border-gray-200 text-gray-400 hover:border-gray-300";
                    }
                }
            }
            const binds = [
                { id: 'cfg-framePreset', key: 'framePreset' },
                { id: 'cfg-pos-x', key: 'posX' },
                { id: 'cfg-frame-scale', key: 'frameScale' },
                { id: 'cfg-text-offset-x', key: 'textOffsetX' },
                { id: 'cfg-text-offset-y', key: 'textOffsetY' },
                { id: 'cfg-font', key: 'font' }, { id: 'cfg-color', key: 'color' }, { id: 'cfg-color-alpha', key: 'colorAlpha' },
                { id: 'cfg-bg-base', key: 'bgBase' }, { id: 'cfg-bg-alpha', key: 'bgAlpha' }, { id: 'cfg-border', key: 'border' },
                { id: 'cfg-border-alpha', key: 'borderAlpha' }, { id: 'cfg-size', key: 'size' }, { id: 'cfg-pos-y', key: 'posY' },
                { id: 'cfg-remote-id', key: 'remoteId' },
                { id: 'cfg-fullWidth', key: 'fullWidth' },
                { id: 'cfg-outline-color', key: 'outlineColor' },
                { id: 'cfg-outline-alpha', key: 'outlineAlpha' },
                { id: 'cfg-outline-width', key: 'outlineWidth' }
            ];
            binds.forEach(b => {
                const el = document.getElementById(b.id);
                if (el) {
                    if (el.type === 'checkbox') {
                        el.checked = !!cfg[b.key];
                    } else {
                        el.value = cfg[b.key];
                    }

                    // カラーピッカーとテキスト入力の同期
                    if (el.type === 'color') {
                        const hexEl = document.getElementById(`${b.id}-hex`);
                        if (hexEl) {
                            hexEl.value = el.value.toUpperCase();
                            hexEl.oninput = () => {
                                if (/^#[0-9A-F]{6}$/i.test(hexEl.value)) {
                                    el.value = hexEl.value;
                                    updateLiveConfig();
                                }
                            };
                            el.oninput = () => {
                                hexEl.value = el.value.toUpperCase();
                                updateLiveConfig();
                            };
                        }
                    } else {
                        el.oninput = null;
                    }

                    if (el.type === 'checkbox') {
                        el.onchange = () => {
                            updateLiveConfig();
                        };
                    } else if (el.type !== 'color') {
                        el.oninput = () => {
                            updateLiveConfig();
                            const id = el.id;
                            if (id.includes('alpha')) {
                                const valEl = document.getElementById(`val-${id.split('-')[1]}-alpha`);
                                if (valEl) valEl.innerText = el.value + '%';
                            }
                            if (id === 'cfg-pos-y') {
                                const posEl = document.getElementById('val-pos-y');
                                if (posEl) posEl.innerText = el.value + '%';
                            }
                            if (id === 'cfg-pos-x') {
                                const posXEl = document.getElementById('val-pos-x');
                                if (posXEl) posXEl.innerText = el.value + '%';
                            }
                            if (id === 'cfg-outline-width') {
                                const owEl = document.getElementById('val-outline-width');
                                if (owEl) owEl.innerText = el.value + 'px';
                            }
                            if (id === 'cfg-outline-alpha') {
                                const oaEl = document.getElementById('val-outline-alpha');
                                if (oaEl) oaEl.innerText = el.value + '%';
                            }
                            if (id === 'cfg-frame-scale') {
                                const fsEl = document.getElementById('val-frame-scale');
                                if (fsEl) fsEl.innerText = Number(el.value).toFixed(2);
                            }
                            if (id === 'cfg-text-offset-x') {
                                const toxEl = document.getElementById('val-text-offset-x');
                                if (toxEl) toxEl.innerText = el.value + 'px';
                            }
                            if (id === 'cfg-text-offset-y') {
                                const toyEl = document.getElementById('val-text-offset-y');
                                if (toyEl) toyEl.innerText = el.value + 'px';
                            }
                        };
                    }

                    if (el.tagName === 'SELECT') {
                        el.onchange = () => {
                            updateLiveConfig();
                        };
                    }

                    if (el.type === 'range') {
                        const id = el.id;
                        if (id.includes('alpha')) {
                            const valEl = document.getElementById(`val-${id.split('-')[1]}-alpha`);
                            if (valEl) valEl.innerText = el.value + '%';
                        }
                        if (id === 'cfg-pos-y') {
                            const posEl = document.getElementById('val-pos-y');
                            if (posEl) posEl.innerText = el.value + '%';
                        }
                        if (id === 'cfg-pos-x') {
                            const posXEl = document.getElementById('val-pos-x');
                            if (posXEl) posXEl.innerText = el.value + '%';
                        }
                        if (id === 'cfg-outline-width') {
                            const owEl = document.getElementById('val-outline-width');
                            if (owEl) owEl.innerText = el.value + 'px';
                        }
                        if (id === 'cfg-outline-alpha') {
                            const oaEl = document.getElementById('val-outline-alpha');
                            if (oaEl) oaEl.innerText = el.value + '%';
                        }
                        if (id === 'cfg-frame-scale') {
                            const fsEl = document.getElementById('val-frame-scale');
                            if (fsEl) fsEl.innerText = Number(el.value).toFixed(2);
                        }
                        if (id === 'cfg-text-offset-x') {
                            const toxEl = document.getElementById('val-text-offset-x');
                            if (toxEl) toxEl.innerText = el.value + 'px';
                        }
                        if (id === 'cfg-text-offset-y') {
                            const toyEl = document.getElementById('val-text-offset-y');
                            if (toyEl) toyEl.innerText = el.value + 'px';
                        }
                    }
                }
            });
            reflectConfigToPreview();
        }

        function hexToRgba(hex, alphaPercent) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alphaPercent / 100})`;
        }

        function updateLiveConfig() {
            const config = {
                posX: parseInt(document.getElementById('cfg-pos-x').value),
                framePreset: document.getElementById('cfg-framePreset').value,
                frameScale: parseFloat(document.getElementById('cfg-frame-scale').value),
                textOffsetX: parseInt(document.getElementById('cfg-text-offset-x').value),
                textOffsetY: parseInt(document.getElementById('cfg-text-offset-y').value),
                font: document.getElementById('cfg-font').value,
                color: document.getElementById('cfg-color').value,
                colorAlpha: parseInt(document.getElementById('cfg-color-alpha').value),
                bgBase: document.getElementById('cfg-bg-base').value,
                bgAlpha: parseInt(document.getElementById('cfg-bg-alpha').value),
                border: document.getElementById('cfg-border').value,
                borderAlpha: parseInt(document.getElementById('cfg-border-alpha').value),
                size: parseInt(document.getElementById('cfg-size').value),
                posY: parseInt(document.getElementById('cfg-pos-y').value),
                remoteId: document.getElementById('cfg-remote-id').value,
                fullWidth: document.getElementById('cfg-fullWidth').checked,
                outlineColor: document.getElementById('cfg-outline-color').value,
                outlineWidth: parseInt(document.getElementById('cfg-outline-width').value),
                outlineAlpha: parseInt(document.getElementById('cfg-outline-alpha').value)
            };
            state.presets[state.editingIndex].config = config;
            reflectConfigToPreview();

            // If editing active slot, send live config
            if (state.editingIndex === state.activeIndex) {
                bc.postMessage({ type: 'LIVE_CONFIG', payload: config });
            }
            // Send update slot msg
            bc.postMessage({
                type: 'UPDATE_SLOT',
                payload: {
                    slotIndex: state.editingIndex,
                    data: state.presets[state.editingIndex].data,
                    config: config
                }
            });
        }

        function applyConfigToElement(container, textEl, scale = 1) {
            const cfg = state.config;

            if (cfg.fullWidth) {
                container.style.width = '100%';
                container.style.left = '0%';
                container.style.top = `${cfg.posY}%`;
                container.style.transform = 'translateY(-50%)';

                textEl.style.width = '100%';
                textEl.style.borderRadius = '0px';
                textEl.style.borderLeft = 'none';
                textEl.style.borderRight = 'none';
            } else {
                container.style.width = '';
                container.style.left = `${cfg.posX}%`;
                container.style.top = `${cfg.posY}%`;
                container.style.transform = 'translate(-50%, -50%)';

                textEl.style.width = 'auto';
                textEl.style.borderRadius = '8px';
                textEl.style.borderLeft = '';
                textEl.style.borderRight = '';
            }

            // テキスト基本スタイル
            textEl.style.fontFamily = cfg.font;
            textEl.style.color = hexToRgba(cfg.color, cfg.colorAlpha);
            textEl.style.fontSize = `${cfg.size * scale}px`;
            textEl.style.lineHeight = '1.2';
            textEl.style.transform = `translate(${cfg.textOffsetX * scale}px, ${cfg.textOffsetY * scale}px)`;

            if (cfg.font.includes('Noto Sans JP') || cfg.font.includes('Kaisei Tokumin')) {
                textEl.style.fontWeight = '700';
            } else {
                textEl.style.fontWeight = 'normal';
            }

            // 背景と枠線
            textEl.style.backgroundColor = hexToRgba(cfg.bgBase, cfg.bgAlpha);
            textEl.style.borderColor = hexToRgba(cfg.border, cfg.borderAlpha);
            textEl.style.borderWidth = (cfg.borderAlpha > 0) ? `${Math.max(1, Math.round(4 * scale))}px` : '0px';

            // 文字縁取り (text-shadow)
            if (cfg.outlineWidth > 0) {
                const w = cfg.outlineWidth * scale;
                const c = hexToRgba(cfg.outlineColor, cfg.outlineAlpha);
                textEl.style.textShadow = `
                    ${w}px ${w}px 0 ${c},
                    -${w}px ${w}px 0 ${c},
                    ${w}px -${w}px 0 ${c},
                    -${w}px -${w}px 0 ${c},
                    ${w}px 0px 0 ${c},
                    -${w}px 0px 0 ${c},
                    0px ${w}px 0 ${c},
                    0px -${w}px 0 ${c}
                `;
            } else {
                textEl.style.textShadow = 'none';
            }

            // フレーム画像（preview / display 両方対応）
            const frameEl =
                (container.id === 'obs-telop') ? document.getElementById('obs-frame') :
                    (container.id === 'preview-telop') ? document.getElementById('preview-frame') :
                        null;

            const preset = FRAME_PRESETS[cfg.framePreset] || FRAME_PRESETS.news;

            if (frameEl && preset.src) {
                frameEl.style.display = '';
                frameEl.onerror = () => { frameEl.style.display = 'none'; };
                frameEl.src = preset.src;

                // フレームサイズ：基準サイズをスケール倍
                const baseW = 1920;
                const targetPx = Math.round(baseW * cfg.frameScale * scale);
                frameEl.style.width = `${targetPx}px`;
            } else if (frameEl) {
                frameEl.style.display = 'none';
            }
        }

        function reflectConfigToPreview() {
            const p = document.getElementById('preview-telop');
            const pt = document.getElementById('preview-text');
            const cfg = state.presets[state.editingIndex].config;

            // Temporarily swap config for applyConfigToElement to work correctly if it uses state.config
            const originalActiveIdx = state.activeIndex;
            state.activeIndex = state.editingIndex;
            applyConfigToElement(p, pt, 0.5);
            state.activeIndex = originalActiveIdx;

            pt.innerText = state.presets[state.editingIndex].data[0] || "プレビューテキスト";
        }

        function saveConfig() {
            saveToStorage('vt_telop_presets', state.presets);
            const btn = document.getElementById('cfg-save-btn');
            const originalText = btn.innerText;
            btn.innerText = "✓ プリセット" + (state.editingIndex + 1) + " 保存完了";
            btn.classList.replace('bg-indigo-600', 'bg-green-600');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-green-600', 'bg-indigo-600');
            }, 2000);
        }

        function toggleResetBtn() {
            const lock = document.getElementById('cfg-reset-lock');
            const btn = document.getElementById('cfg-reset-btn');
            btn.disabled = !lock.checked;
        }

        function resetConfig() {
            state.presets[state.editingIndex].config = { ...DEFAULT_CONFIG };
            saveToStorage('vt_telop_presets', state.presets);
            bc.postMessage({
                type: 'UPDATE_SLOT',
                payload: {
                    slotIndex: state.editingIndex,
                    data: state.presets[state.editingIndex].data,
                    config: state.presets[state.editingIndex].config
                }
            });
            if (state.editingIndex === state.activeIndex) {
                bc.postMessage({ type: 'LIVE_CONFIG', payload: state.presets[state.editingIndex].config });
            }
            initConfigUI();
            updateLiveConfig();

            const btn = document.getElementById('cfg-reset-btn');
            btn.innerText = "初期化しました";
            setTimeout(() => {
                btn.innerText = "すべての表示設定を初期化";
                document.getElementById('cfg-reset-lock').checked = false;
                toggleResetBtn();
            }, 2000);
        }

        function renderControllerList() {
            const listEl = document.getElementById('ctrl-list');
            if (!listEl) return;
            const data = state.presets[state.activeIndex].data;
            listEl.innerHTML = '';
            data.forEach((text, i) => {
                const div = document.createElement('div');
                div.className = `p-3 mb-2 rounded-lg cursor-pointer border-2 transition-all flex items-center gap-3 ${i === state.index ? 'border-indigo-500 bg-indigo-50 shadow-inner' : 'border-transparent bg-gray-50 hover:bg-gray-100'}`;
                div.onclick = () => jumpToIndex(i);
                div.innerHTML = `<div class="w-6 h-6 rounded-full border flex items-center justify-center font-bold text-xs ${i === state.index ? 'bg-indigo-500 text-white' : 'bg-white text-gray-400'}">${i + 1}</div><div class="font-bold truncate ${i === state.index ? 'text-indigo-900' : 'text-gray-600'}">${text}</div>`;
                listEl.appendChild(div);
            });
        }

        function updateControllerUI() {
            const data = state.presets[state.activeIndex].data;
            const currentTextEl = document.getElementById('ctrl-current-text');
            if (currentTextEl) currentTextEl.innerText = data[state.index] || "待機中...";

            const progressEl = document.getElementById('ctrl-progress');
            if (progressEl) progressEl.innerText = `${data.length > 0 ? state.index + 1 : 0} / ${data.length}`;

            const btn = document.getElementById('ctrl-toggle-btn');
            if (btn) {
                btn.innerText = state.visible ? 'ON' : 'OFF';
                btn.className = state.visible ? 'bg-green-500 text-white px-6 py-2 rounded-md font-bold btn-transition shadow-sm' : 'bg-gray-400 text-white px-6 py-2 rounded-md font-bold btn-transition shadow-sm';
            }

            // Update slot buttons
            for (let i = 0; i < 3; i++) {
                const sBtn = document.getElementById(`ctrl-slot-${i}`);
                if (sBtn) {
                    if (state.activeIndex === i) {
                        sBtn.className = "px-2 py-0.5 rounded text-[10px] font-bold border transition-all bg-indigo-600 text-white border-indigo-600";
                    } else {
                        sBtn.className = "px-2 py-0.5 rounded text-[10px] font-bold border transition-all bg-white text-gray-400 border-gray-200";
                    }
                }
            }

            syncAutoRotateControls();
            renderControllerList();
        }

        function syncAutoRotateControls() {
            const secondsEl = document.getElementById('ctrl-auto-seconds');
            const loopEl = document.getElementById('ctrl-auto-loop');
            const btnEl = document.getElementById('ctrl-auto-btn');
            const statusEl = document.getElementById('ctrl-auto-status');
            const summaryEl = document.getElementById('ctrl-auto-summary');
            if (secondsEl) secondsEl.value = state.autoRotate.intervalSec;
            if (loopEl) loopEl.checked = state.autoRotate.loop;
            if (btnEl) {
                btnEl.innerText = state.autoRotate.enabled ? 'AUTO ON' : 'AUTO OFF';
                btnEl.className = state.autoRotate.enabled
                    ? 'bg-emerald-500 text-white px-5 py-2 rounded-md font-bold btn-transition shadow-sm'
                    : 'bg-orange-500 text-white px-5 py-2 rounded-md font-bold btn-transition shadow-sm';
            }
            if (statusEl) {
                const hasItems = state.data.length > 1;
                if (!state.autoRotate.enabled) {
                    statusEl.innerText = '自動送りは停止中です';
                } else if (!hasItems) {
                    statusEl.innerText = '項目が1件以下のため自動送り待機中です';
                } else {
                    statusEl.innerText = `${state.autoRotate.intervalSec}秒ごとに${state.autoRotate.loop ? 'ループあり' : '最後で停止'}で自動送り中`;
                }
            }
            if (summaryEl) {
                summaryEl.innerText = state.autoRotate.enabled
                    ? `現在は ${state.autoRotate.intervalSec} 秒ごとの自動送りです。${state.autoRotate.loop ? 'ループあり。' : '最後で停止。'}`
                    : 'お知らせや箇条書きを一定時間ごとに自動で切り替えます。';
            }
            syncAutoRotatePanel();
        }

        function clearAutoRotateTimer() {
            if (autoRotateTimer) {
                clearTimeout(autoRotateTimer);
                autoRotateTimer = null;
            }
        }

        function getNextAutoRotateIndex() {
            const data = state.data;
            if (data.length <= 1) return null;
            const nextIndex = state.index + 1;
            if (nextIndex < data.length) return nextIndex;
            if (state.autoRotate.loop) return 0;
            return null;
        }

        function restartAutoRotateIfNeeded() {
            clearAutoRotateTimer();
            syncAutoRotateControls();
            if (!state.autoRotate.enabled) return;
            if (state.data.length <= 1) return;

            autoRotateTimer = setTimeout(() => {
                const nextIndex = getNextAutoRotateIndex();
                if (nextIndex === null) {
                    state.autoRotate.enabled = false;
                    saveAutoRotateSettings();
                    syncAutoRotateControls();
                    return;
                }
                jumpToIndex(nextIndex, { restartAutoRotate: false });
                restartAutoRotateIfNeeded();
            }, state.autoRotate.intervalSec * 1000);
        }

        function applyAutoRotateOptionsFromUI() {
            const secondsEl = document.getElementById('ctrl-auto-seconds');
            const loopEl = document.getElementById('ctrl-auto-loop');
            if (secondsEl) {
                const parsed = Math.max(1, Math.min(600, parseInt(secondsEl.value, 10) || 8));
                state.autoRotate.intervalSec = parsed;
                secondsEl.value = parsed;
            }
            if (loopEl) state.autoRotate.loop = loopEl.checked;
            saveAutoRotateSettings();
            syncAutoRotateControls();
            if (state.autoRotate.enabled) restartAutoRotateIfNeeded();
        }

        function toggleAutoRotate(forceValue = null) {
            applyAutoRotateOptionsFromUI();
            state.autoRotate.enabled = typeof forceValue === 'boolean' ? forceValue : !state.autoRotate.enabled;
            saveAutoRotateSettings();
            restartAutoRotateIfNeeded();
        }

        function activateSlot(idx) {
            state.activeIndex = idx;
            state.index = 0;
            saveToStorage('vt_telop_active_slot', state.activeIndex);
            saveToStorage('vt_telop_index', state.index);
            bc.postMessage({ type: 'SWITCH_ACTIVE_SLOT', payload: idx });
            updateControllerUI();
            restartAutoRotateIfNeeded();
            if (isVisible('display')) {
                applyConfigToElement(document.getElementById('obs-telop'), document.getElementById('obs-text'));
                updateDisplayUI();
            }
        }

        function jumpToIndex(idx, options = {}) {
            const { restartAutoRotate = true } = options;
            if (idx < 0 || idx >= state.data.length) return;
            state.index = idx;
            saveToStorage('vt_telop_index', state.index);
            bc.postMessage({ type: 'UPDATE_INDEX', payload: state.index });
            updateControllerUI();
            if (restartAutoRotate) restartAutoRotateIfNeeded();
        }

        function changeIndex(delta) { jumpToIndex(state.index + delta); }

        function toggleVisibility() {
            state.visible = !state.visible;
            saveToStorage('vt_telop_visible', state.visible);
            bc.postMessage({ type: 'TOGGLE_VISIBILITY', payload: state.visible });
            updateControllerUI();
        }

        function updateDisplayUI() {
            const container = document.getElementById('obs-telop');
            const textEl = document.getElementById('obs-text');
            if (!container || !textEl) return;

            if (!state.visible || state.data.length === 0) {
                container.classList.add('hidden-telop');
                return;
            }
            const newText = state.data[state.index];
            if (textEl.innerText === newText && !container.classList.contains('hidden-telop')) return;
            textEl.style.opacity = 0;
            setTimeout(() => {
                textEl.innerText = newText;
                textEl.style.opacity = 1;
                container.classList.remove('hidden-telop');
            }, 250);
        }

        window.onload = init;

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (!isVisible('controller')) return;
            // 入力中（input/textareaにフォーカスがある時）はホットキーを無効化
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            switch (e.key.toLowerCase()) {
                case 'n':
                case 'arrowright':
                case ' ':
                    e.preventDefault(); // スペースキーなどでのスクロールを防止
                    changeIndex(1);
                    break;

                case 'p':
                case 'arrowleft':
                    e.preventDefault();
                    changeIndex(-1);
                    break;

                case 'v':
                    e.preventDefault();
                    toggleVisibility();
                    break;
                case 'a':
                    e.preventDefault();
                    toggleAutoRotate();
                    break;

                // テンキーおよび記号キーでの操作追加
                case '+':
                    e.preventDefault();
                    changeIndex(1);
                    break;
                case '-':
                    e.preventDefault();
                    changeIndex(-1);
                    break;
                case '*':
                    e.preventDefault();
                    toggleVisibility();
                    break;

                case '0': case '1': case '2': case '3': case '4':
                case '5': case '6': case '7': case '8': case '9':
                    // 数字キー。jumpToIndexを利用することでlocalStorage保存などを一括で行う
                    const num = parseInt(e.key, 10);
                    const idx = num === 0 ? 9 : num - 1; // 0キーは10番目とする
                    jumpToIndex(idx);
                    break;
            }
        });

        document.addEventListener('change', (e) => {
            if (e.target.id === 'ctrl-auto-seconds' || e.target.id === 'ctrl-auto-loop') {
                applyAutoRotateOptionsFromUI();
            }
        });
    </script>
</body>

</html>
