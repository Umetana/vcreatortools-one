<!-- custom base template v2.8 dev index.html -->
<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Comment Halloween StageFX V2</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./effects/halloween_parade_effect/style.css" />
</head>

<body>
  <div id="app" :class="[stackClass, visualModeClass, giftColorModeClass, { 'stage-background-off': !config.SHOW_STAGE_BACKGROUND, 'comment-frame-off': !config.SHOW_COMMENT_FRAME, 'ambient-off': !config.SHOW_AMBIENT_EFFECTS, 'reduced-motion': config.REDUCED_MOTION }]">
    <main class="stage" aria-label="ハロウィンコメントステージ">
      <div class="stage__background" aria-hidden="true"></div>
      <div class="stage__moon" aria-hidden="true">☾</div>
      <div class="stage__ambient" aria-hidden="true">
        <span class="bat bat--one">🦇</span><span class="bat bat--two">🦇</span>
        <span class="ghost ghost--one">👻</span><span class="ghost ghost--two">👻</span>
        <span class="fog fog--one"></span><span class="fog fog--two"></span>
      </div>
      <div class="stage__effect-backdrop" aria-hidden="true"></div>
      <div class="stage__effects" aria-hidden="true"></div>
      <div class="stage__title" aria-hidden="true"><span>🎃</span> HALLOWEEN NIGHT <span>🎃</span></div>

      <section class="comment-region" aria-label="コメント表示領域">
        <div class="comment-region__ornament" aria-hidden="true">🕸️</div>
        <!-- コメントリスト -->
        <transition-group name="list" tag="div" class="cmt-list">
      <div v-for="cmt in comments" :key="cmt.id" class="cmt-shell" :class="'cmt-event--' + cmt.eventKind">
        <div class="cmt" :class="{ 'cmt-gift': cmt.isSupport, 'cmt-member': cmt.isMembership, 'cmt-system': cmt.isSticky }"
          :style="cmt.giftColor ? { '--gift-color': cmt.giftColor } : {}">

          <!-- アイコン -->
          <div v-if="showCommentIcon(cmt)" class="cmt__icon" :class="{ 'cmt__icon--halloween': activeIconMode() === 'halloween' }">
            <span v-if="activeIconMode() === 'halloween'" class="cmt__halloween-icon" aria-hidden="true">{{ cmt.halloweenIcon }}</span>
            <img v-else :src="cmt.profileImage" alt="">
          </div>

          <div class="cmt__content">
            <!-- ヘッダー (名前・バッジ・メタ情報) -->
            <div v-if="config.SHOW_NAME || config.SHOW_BADGES || config.SHOW_USER_FLAGS || cmt.metaLabels.length" class="cmt__header">
              <span v-if="config.SHOW_NAME" class="cmt__name">{{ cmt.name }}</span>
              <div v-if="config.SHOW_BADGES" class="cmt__badges">
                <span v-for="(b, i) in cmt.badges" :key="b.url || b.label || i" class="cmt__badge">
                  <img v-if="b.url" :src="b.url" :title="b.label">
                  <span v-else class="cmt__badge-text">{{ b.label }}</span>
                </span>
              </div>
              <div v-if="config.SHOW_USER_FLAGS && cmt.userFlags.length" class="cmt__user-flags">
                <span v-for="flag in cmt.userFlags" :key="flag.type" class="cmt__user-flag"
                  :class="'cmt__user-flag--' + flag.type">{{ flag.text }}</span>
              </div>
              <div v-if="cmt.metaLabels.length" class="cmt__meta">
                <span v-for="(label, i) in cmt.metaLabels" :key="label.type + ':' + label.text + ':' + i" class="cmt__meta-label"
                  :class="'cmt__meta-label--' + label.type">{{ label.text }}</span>
              </div>
            </div>

            <!-- メッセージ本文 (テキスト+絵文字混合対応) -->
            <div v-if="cmt.parts.length" class="cmt__message">
              <template v-for="(p, i) in cmt.parts" :key="i">
                <span v-if="p.type === 'text'">{{ p.content }}</span>
                <img v-else-if="p.type === 'emoji'" :src="p.url" class="emoji" :class="{ 'emoji--sticker': p.isSticker }"
                  :alt="p.alt">
              </template>
            </div>
            <div v-if="cmt.translationParts && cmt.translationParts.length" class="cmt__message cmt__message--translation">
              <template v-for="(p, i) in cmt.translationParts" :key="'tr-' + i">
                <span v-if="p.type === 'text'">{{ p.content }}</span>
                <img v-else-if="p.type === 'emoji'" :src="p.url" class="emoji" :class="{ 'emoji--sticker': p.isSticker }"
                  :alt="p.alt">
              </template>
            </div>
          </div>

        </div>
      </div>
        </transition-group>
      </section>
      <div class="stage__foreground" aria-hidden="true"><span>🎃</span><span>🍬</span><span>🎃</span></div>
    </main>
  </div>

  <!-- 公式ライブラリ参照 -->
  <script src="../__origin/js/vue3.min.js"></script>
  <script src="../__origin/js/onesdk.js"></script>

  <!-- 設定読込順: default -> config.js -> localStorage -->
  <script src="./config_default.js"></script>
  <script src="./config.js"></script>
  <script src="./settings/config-runtime.js"></script>
  <!-- V-Creator Tools: VCT SDK -->
  <script src="./lib/vct_sdk.js?v=2.0.3-dev"></script>

  <!-- StageFX runtime and bundled effect plugin -->
  <script src="./effects/runtime/effect-context.js"></script>
  <script src="./effects/runtime/effect-host.js"></script>
  <script src="./effects/halloween_parade_effect/main.js"></script>

  <!-- 設定パネル本体はギアクリック時に遅延読込 -->
  <script src="./settings/settings-launcher.js"></script>

  <!-- template main.js -->
  <script src="./main.js"></script>
</body>

</html>
